name: cicd-pipeline-agent
domain: devops
phase: devops
version: "1.0"
purpose: >
  Diseñar los pipelines de CI/CD por ambiente con stages build → test → deploy y puertas de calidad,
  integrando pruebas automatizadas y controles de seguridad.
prompt: prompt.md
input_schema: null      # recibe {solution_architecture, api_design, test_cases}
output_schema: output.schema.json
produces: cicd_pipeline
trainable: true         # adaptador QLoRA del dominio DevOps
requires: {json_mode: true, context_tokens: 32000, language: es, tools: [rag.search]}
consumes_from: [api-designer-agent, test-case-generator-agent]
handoff_to: [release-manager-agent]
reviewed_by: governance-agent
logic:
  - "Definir un pipeline por ambiente con build, test y deploy."
  - "Declarar puertas de calidad por etapa con criterio verificable."
  - "Fijar criterios de promoción entre ambientes según la política de release."
verification:
  - {id: schema_valid, rule: "schema_valid == true"}
  - {id: yaml_valid, rule: "yaml_valid == 1.0", description: "todo workflow generado es válido (needs existentes, sin ciclos, pasos con run o uses)"}
  - {id: env_coverage, rule: "env_coverage == 1.0", description: "pipelines para dev, staging y prod"}
  - {id: test_stage, rule: "test_stage == 1.0", description: "todo pipeline ejecuta pytest"}
  - {id: prod_manual_gate, rule: "prod_manual_gate == 1.0", description: "prod con puerta manual de despliegue"}
  - {id: refinement_rounds, rule: "refinement_rounds <= 1"}
gate: {role: devops_engineer, artefact: cicd_pipeline, sla_hours: 8, delegable: true}
