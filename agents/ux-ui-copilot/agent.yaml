name: ux-ui-copilot-agent
domain: discovery
phase: discovery
version: "1.0"
purpose: >
  Traducir las historias de usuario en una especificación de interfaz: pantallas, flujo de navegación,
  estados vacíos y de error, y criterios de accesibilidad, respetando las convenciones de diseño del corpus.
prompt: prompt.md
input_schema: ../product-analyst/output.schema.json
output_schema: output.schema.json
requires:
  json_mode: true
  context_tokens: 16000
  language: es
  tools: [rag.search]
consumes_from: [product-analyst-agent]
handoff_to: [frontend-dev-agent]
reviewed_by: governance-agent
logic:
  - "Agrupar historias por pantalla; una pantalla puede cubrir varias historias."
  - "Consultar rag.search por convenciones de UI y componentes aprobados."
  - "Definir flujo desde/hacia con la acción que lo dispara; incluir estados vacíos y de error."
  - "Rellenar provenance con los ids consultados."
verification:
  - id: schema_valid
    rule: "schema_valid == true"
  - id: story_coverage
    rule: "story_coverage == 1.0"
    description: "toda historia US-xx aparece en al menos una pantalla"
  - id: error_states
    rule: "error_states >= 1"
  - id: refinement_rounds
    rule: "refinement_rounds <= 1"
gate:
  role: product_owner
  artefact: ux_spec
  sla_hours: 8
  delegable: true
