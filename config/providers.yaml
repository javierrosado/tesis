# Único archivo que cambia al migrar de proveedor de modelo.
# Los agentes declaran capacidades (requires); aquí se decide qué adaptador las satisface.
#
# Uso:  PIPELINE_PROVIDER=prueba_offline python scripts/run_pipeline.py --req SIM-P05-R001
#       (la variable de entorno sobreescribe "default")
#
# Fase 1 (pruebas internas, NO entra en la tesis): default: anthropic
# Fase 2 (piloto reportado en 3.1.3):              vllm_local (jobs/run_pipeline_job.py)
# Fase 3 (ablación con fine-tuning):               overrides.product-analyst-agent.adapter_weights

default: prueba_offline

providers:
  prueba_offline:                      # sin modelo: artefactos de ejemplo predefinidos (tests/fixtures); solo para probar el software (CI, dry-run)
    adapter: prueba_offline
    fixtures: tests/fixtures

  mock:                                # nombre anterior de prueba_offline (alias, se mantiene por compatibilidad)
    adapter: prueba_offline
    fixtures: tests/fixtures

  anthropic:                           # solo desarrollo interno
    adapter: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    temperature: 0.2

  hf_local:                            # modelo open-weight en la misma máquina/notebook (Colab T4/L4)
    adapter: hf_local
    model: Qwen/Qwen3-8B
    quantization: int4                 # bitsandbytes nf4; cabe en 16 GB
    max_new_tokens: 4096
    temperature: 0.2
    json_grammar: true                 # decodificación restringida por el JSON Schema (outlines)
    chat_template_kwargs: {enable_thinking: false}   # Qwen3: sin modo razonamiento en salidas JSON

  vllm_local:                          # vLLM en el mismo job de HF (open-weight; sin API keys); sirve también los LoRA
    adapter: openai_compat
    model: Qwen/Qwen3-8B
    url: http://localhost:8000/v1
    max_new_tokens: 4096
    temperature: 0.2
    chat_template_kwargs: {enable_thinking: false}

  teacher:                             # F2-A: modelo maestro para destilación (solo genera el dataset; no entra al piloto)
    adapter: openai_compat
    model: Qwen/Qwen3-32B-AWQ
    url: http://localhost:8000/v1
    max_new_tokens: 6144
    temperature: 0.3
    chat_template_kwargs: {enable_thinking: false}

  vllm_teacher:                        # D-F4-1 opción C (20/11/2026): segundo vLLM del mismo job para los agentes que escriben código
    adapter: openai_compat
    model: Qwen/Qwen3-32B-AWQ
    url: http://localhost:8001/v1
    max_new_tokens: 10240          # D-E5: el backend con hasta 10 filas por tabla superaba 6144 (ensayo1 r14)
    temperature: 0.2
    chat_template_kwargs: {enable_thinking: false}

  # v2 · D-P5 (24/11/2026): modelos open-weight de frontera servidos por HF Inference Providers (router de Hugging Face,
  # OpenAI-compatible, se paga con la cuenta HF; sin claves de terceros). Proveedor fijado con el sufijo ":<proveedor>";
  # el job registra repo@sha y proveedor en entorno.json. Elección del proveedor: salida estructurada disponible, servidor
  # fuera de China y precio publicado en router.huggingface.co/v1/models (consulta del 24/11/2026).
  hf_glm53:                            # Frontera candidata: GLM-5.3 (Together: USD 1,40 / 4,40 por M tokens)
    adapter: openai_compat
    model: "zai-org/GLM-5.3:together"
    url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    max_new_tokens: 16384
    max_new_tokens_maximo: 32768
    temperature: 0.2
    acepta_reasoning_effort: true
    context_tokens: 1000000
    timeout_s: 1200

  hf_dsv4pro:                          # Frontera candidata: DeepSeek V4-Pro (DeepInfra: USD 1,30 / 2,60 por M tokens)
    adapter: openai_compat
    model: "deepseek-ai/DeepSeek-V4-Pro:deepinfra"
    url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    max_new_tokens: 16384
    max_new_tokens_maximo: 32768
    temperature: 0.2
    acepta_reasoning_effort: true
    context_tokens: 1000000
    timeout_s: 1200

  hf_dsv4flash:                        # alternativa de costo: DeepSeek V4-Flash (DeepInfra: USD 0,09 / 0,18 por M tokens)
    adapter: openai_compat
    model: "deepseek-ai/DeepSeek-V4-Flash:deepinfra"
    url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    max_new_tokens: 16384
    temperature: 0.2
    acepta_reasoning_effort: true
    context_tokens: 1000000
    timeout_s: 1200

  hf_qwen36:                           # N2 candidato: Qwen3.6-35B-A3B (único proveedor: Venice, sin salida estructurada)
    adapter: openai_compat
    model: "Qwen/Qwen3.6-35B-A3B:venice"
    url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    max_new_tokens: 8192
    temperature: 0.2
    salida_estructurada: false         # el esquema va en el prompt y el puerto valida el contrato (reintentos con feedback)
    context_tokens: 256000
    timeout_s: 900

  claude_ref:                          # v2 · referencia de techo (uso 2) y, solo en E4 con C1–C4, code-review/security.
    adapter: anthropic                 # API de pago por uso (Claude Console), NO la suscripción; model_id fijado
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 16000                  # sin temperature: el SDK de Anthropic la rechaza para este modelo (25/11)

  hf_endpoint:                         # Inference Endpoint dedicado en Hugging Face (opcional)
    adapter: hf_endpoint
    model: Qwen/Qwen3-8B
    url_env: HF_ENDPOINT_URL
    token_env: HF_TOKEN

  ollama:                              # alternativa local fuera de Colab
    adapter: ollama
    model: qwen3:8b
    url: http://localhost:11434

# D-E1 (23/11/2026, hallazgo del ensayo1): cuando el humano devuelve un artefacto, la corrección la genera el maestro
# (Qwen3-32B-AWQ). La primera versión sigue siendo del agente (LoRA o base). Los modelos de 8B no seguían las devoluciones.
correccion_humana: {for_provider: vllm_local, switch_to: vllm_teacher}
# G5 / D-P3 (24/11/2026): el dictamen IA de cada puerta humana lo genera el maestro del pipeline (no Claude). En backend, qa y
# code_review el maestro también produce el artefacto: el dictamen se marca autoevaluacion=true y se declara como limitación.
dictamen: {for_provider: vllm_local, switch_to: vllm_teacher}

overrides:
  # F3: cada agente entrenable usa su adaptador QLoRA, servido por vLLM con el mismo nombre (jobs/run_pipeline_job.py)
  product-analyst-agent: {for_provider: vllm_local, model: product-analyst-agent}
  solution-architect-agent: {for_provider: vllm_local, model: solution-architect-agent}
  api-designer-agent: {for_provider: vllm_local, model: api-designer-agent}
  test-case-generator-agent: {for_provider: vllm_local, model: test-case-generator-agent}
  cicd-pipeline-agent: {for_provider: vllm_local, model: cicd-pipeline-agent}
  # D-F4-1 opción C: backend, QA y revisión de código (no entrenados) los atiende el maestro Qwen3-32B-AWQ (open-weight, mismo job)
  backend-developer-agent: {for_provider: vllm_local, switch_to: vllm_teacher}
  qa-automation-agent: {for_provider: vllm_local, switch_to: vllm_teacher}
  code-review-agent: {for_provider: vllm_local, switch_to: vllm_teacher}
