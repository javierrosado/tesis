# Único archivo que cambia al migrar de proveedor de modelo.
# Los agentes declaran capacidades (requires); aquí se decide qué adaptador las satisface.
#
# Uso:  PIPELINE_PROVIDER=mock python scripts/run_pipeline.py --req SIM-P05-R001
#       (la variable de entorno sobreescribe "default")
#
# Fase 1 (pruebas internas, NO entra en la tesis): default: anthropic
# Fase 2 (piloto reportado en 3.1.3):              default: hf_local
# Fase 3 (ablación con fine-tuning):               overrides.product-analyst-agent.adapter_weights

default: mock

providers:
  mock:
    adapter: mock
    fixtures: tests/fixtures          # respuestas grabadas; sirve para CI y dry-run sin red

  anthropic:                           # solo desarrollo interno
    adapter: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    temperature: 0.2

  hf_local:                            # modelo open-weight en la misma máquina/notebook (Colab T4/L4)
    adapter: hf_local
    model: Qwen/Qwen2.5-7B-Instruct
    quantization: int4                 # bitsandbytes nf4; cabe en 16 GB
    max_new_tokens: 2048
    temperature: 0.2
    json_grammar: true                 # decodificación restringida por el JSON Schema (outlines)

  hf_endpoint:                         # Inference Endpoint dedicado en Hugging Face (opcional)
    adapter: hf_endpoint
    model: Qwen/Qwen2.5-7B-Instruct
    url_env: HF_ENDPOINT_URL
    token_env: HF_TOKEN

  ollama:                              # alternativa local fuera de Colab
    adapter: ollama
    model: qwen2.5:7b
    url: http://localhost:11434

overrides: {}
# Fase 3, ejemplo:
# overrides:
#   product-analyst-agent:
#     provider: hf_local
#     adapter_weights: javierrosado/product-analyst-lora   # adaptador LoRA en HF Hub
