# Único archivo que cambia al migrar de proveedor de modelo.
# Los agentes declaran capacidades (requires); aquí se decide qué adaptador las satisface.
#
# Uso:  PIPELINE_PROVIDER=mock python scripts/run_pipeline.py --req SIM-P05-R001
#       (la variable de entorno sobreescribe "default")
#
# Fase 1 (pruebas internas, NO entra en la tesis): default: anthropic
# Fase 2 (piloto reportado en 3.1.3):              default: hf_local
# Fase 3 (ablación con fine-tuning):               overrides.product-analyst-agent.adapter_weights

default: mock

providers:
  mock:
    adapter: mock
    fixtures: tests/fixtures          # respuestas grabadas; sirve para CI y dry-run sin red

  anthropic:                           # solo desarrollo interno
    adapter: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    temperature: 0.2

  hf_local:                            # modelo open-weight en la misma máquina/notebook (Colab T4/L4)
    adapter: hf_local
    model: Qwen/Qwen3-8B
    quantization: int4                 # bitsandbytes nf4; cabe en 16 GB
    max_new_tokens: 4096
    temperature: 0.2
    json_grammar: true                 # decodificación restringida por el JSON Schema (outlines)
    chat_template_kwargs: {enable_thinking: false}   # Qwen3: sin modo razonamiento en salidas JSON

  vllm_local:                          # vLLM en el mismo job de HF (open-weight; sin API keys); sirve también los LoRA
    adapter: openai_compat
    model: Qwen/Qwen3-8B
    url: http://localhost:8000/v1
    max_new_tokens: 4096
    temperature: 0.2
    chat_template_kwargs: {enable_thinking: false}

  teacher:                             # F2-A: modelo maestro para destilación (solo genera el dataset; no entra al piloto)
    adapter: openai_compat
    model: Qwen/Qwen3-32B-AWQ
    url: http://localhost:8000/v1
    max_new_tokens: 6144
    temperature: 0.3
    chat_template_kwargs: {enable_thinking: false}

  vllm_teacher:                        # D-F4-1 opción C (20/11/2026): segundo vLLM del mismo job para los agentes que escriben código
    adapter: openai_compat
    model: Qwen/Qwen3-32B-AWQ
    url: http://localhost:8001/v1
    max_new_tokens: 6144
    temperature: 0.2
    chat_template_kwargs: {enable_thinking: false}

  hf_endpoint:                         # Inference Endpoint dedicado en Hugging Face (opcional)
    adapter: hf_endpoint
    model: Qwen/Qwen3-8B
    url_env: HF_ENDPOINT_URL
    token_env: HF_TOKEN

  ollama:                              # alternativa local fuera de Colab
    adapter: ollama
    model: qwen3:8b
    url: http://localhost:11434

overrides:
  # F3: cada agente entrenable usa su adaptador QLoRA, servido por vLLM con el mismo nombre (jobs/run_pipeline_job.py)
  product-analyst-agent: {for_provider: vllm_local, model: product-analyst-agent}
  solution-architect-agent: {for_provider: vllm_local, model: solution-architect-agent}
  api-designer-agent: {for_provider: vllm_local, model: api-designer-agent}
  test-case-generator-agent: {for_provider: vllm_local, model: test-case-generator-agent}
  cicd-pipeline-agent: {for_provider: vllm_local, model: cicd-pipeline-agent}
  # D-F4-1 opción C: backend, QA y revisión de código (no entrenados) los atiende el maestro Qwen3-32B-AWQ (open-weight, mismo job)
  backend-developer-agent: {for_provider: vllm_local, switch_to: vllm_teacher}
  qa-automation-agent: {for_provider: vllm_local, switch_to: vllm_teacher}
  code-review-agent: {for_provider: vllm_local, switch_to: vllm_teacher}
