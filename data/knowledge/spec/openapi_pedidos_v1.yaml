openapi: 3.1.0
info: { title: API Pedidos (Squad Pedidos, SIM-P03) — contrato publicado, version: 1.3.0 }
servers: [{ url: /pedidos/v1 }]
paths:
  /pedidos/{pedidoId}/estado:
    get:
      summary: Estado actual del pedido y número de guía
      parameters: [{ name: pedidoId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EstadoPedido' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /pedidos/eventos:
    description: Eventos publicados (PedidoAprobado, PedidoEnPreparacion, PedidoDespachado, PedidoEntregado) — consumo por suscripción
components:
  schemas:
    EstadoPedido:
      type: object
      required: [pedidoId, estado, actualizadoEn]
      properties:
        pedidoId: { type: string }
        estado: { type: string, enum: [registrado, aprobado, en_preparacion, despachado, entregado, anulado] }
        numeroGuia: { type: string, nullable: true }
        courier: { type: string, nullable: true }
        fechaEstimadaEntrega: { type: string, format: date, nullable: true }
        actualizadoEn: { type: string, format: date-time }
  responses:
    Problem: { description: Error RFC 7807, content: { application/problem+json: { schema: { type: object, properties: { type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}, correlation_id: {type: string} } } } } }
