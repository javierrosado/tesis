name: PIPE-002 staging
'on':
  push:
    branches:
    - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Pruebas
      run: pip install -r requirements.txt && pytest -q
  deploy:
    runs-on: ubuntu-latest
    needs:
    - test
    environment: staging
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Desplegar
      run: ./deploy.sh staging
