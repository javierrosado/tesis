openapi: 3.1.0
info:
  title: Seguimiento de pedidos
  version: v1
paths:
  /v1/pedidos/{pedidoId}/estado:
    get:
      operationId: ep_001
      summary: Obtiene el estado actual y la fecha estimada de entrega
      parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Estado actual del pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPedido'
        '404':
          description: Pedido no encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - SEC-SCHEME-001: []
components:
  schemas:
    EstadoPedido:
      type: object
      properties:
        pedidoId:
          type: string
        estado:
          type: string
        fechaEstimadaEntrega:
          type: string
      required:
      - pedidoId
      - estado
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - correlation_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
  securitySchemes:
    SEC-SCHEME-001:
      type: http
      scheme: bearer
      bearerFormat: JWT
